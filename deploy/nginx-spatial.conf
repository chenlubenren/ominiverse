server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name example.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://example.com$request_uri; }
}


server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SpatialTLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 180m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml model/gltf-binary model/gltf+json application/octet-stream;

    location = /__access_lab_health__ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8910;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_intercept_errors on;
    }
    error_page 500 502 503 504 =503 /service-unavailable.html;
    location = /service-unavailable.html {
        internal;
        default_type text/html;
        charset utf-8;
        return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>服务恢复中</title><body><h1>服务正在恢复</h1><p>请稍后刷新页面。</p></body></html>';
    }
}
